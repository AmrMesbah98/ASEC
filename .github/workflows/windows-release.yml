name: Windows Release

# Builds the ASEC Windows app (same setup as services_module):
#  - push a tag that starts with "v" (e.g. v1.0.3) -> builds and attaches
#    to a GitHub release named after the tag:
#      ASEC-Setup.exe   — the installer (windows/installer/asec_setup.iss)
#      ASEC-windows.zip — the same app as a portable folder
#    The names are FIXED on purpose: the website's "Download for Windows"
#    button (lib/features/web/site/widgets/download_button.dart) looks for
#    them on the latest release (the installer first).
#  - Actions tab -> "Windows Release" -> "Run workflow" -> builds only; the
#    zip is under the run's Artifacts (kept 7 days)
#
#   git tag v1.0.3
#   git push origin v1.0.3
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A newer run for the same tag / branch cancels the older one.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    env:
      # True when the Firebase service-account key is set (see the last steps).
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          # MSVC 14.51 (VS 18.6+) turns <experimental/coroutine> into a hard
          # error; some Windows plugins still include it.
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          # The Firebase C++ SDK's CMakeLists.txt still declares
          # cmake_minimum_required(VERSION 3.1), which CMake 4.x rejects.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release

      # A clean Windows PC may not have the Visual C++ runtime the app
      # needs; ship its DLLs next to ASEC.exe so it starts everywhere.
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $dest = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $dest -Force
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          if (Test-Path "ASEC-windows.zip") { Remove-Item "ASEC-windows.zip" }
          Compress-Archive -Path "build/windows/x64/runner/Release\*" -DestinationPath "ASEC-windows.zip"

      - name: Build installer (ASEC-Setup.exe)
        shell: pwsh
        run: |
          # Version: the tag without "v" (v1.0.3 -> 1.0.3), else pubspec.yaml.
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD" "windows\installer\asec_setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asec-windows-${{ github.ref_name }}
          path: |
            ASEC-Setup.exe
            ASEC-windows.zip
          retention-days: 7
          compression-level: 0

      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ASEC-Setup.exe
            ASEC-windows.zip

      # THE WEBSITE SERVES THE FILE ITSELF: the installer is copied to the
      # project's Firebase Storage (downloads/), and the site's "Download for
      # Windows" button downloads it from there — visitors never see GitHub.
      # Needs the repo secret GCP_SA_KEY (a Firebase service-account JSON
      # key); without it this step is skipped and the button falls back to
      # the GitHub release file.
      - name: Publish installer to the website (Firebase Storage)
        if: github.ref_type == 'tag' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: github.ref_type == 'tag' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload installer + latest.json
        if: github.ref_type == 'tag' && env.HAS_SA_KEY == 'true'
        shell: pwsh
        run: |
          $bucket = "gs://asec-a811b.firebasestorage.app/downloads"
          $tag = "${{ github.ref_name }}"
          $file = "ASEC-Setup-$tag.exe"
          gcloud storage cp "ASEC-Setup.exe" "$bucket/$file" `
            --content-type="application/octet-stream" `
            --content-disposition='attachment; filename="ASEC-Setup.exe"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $size = (Get-Item "ASEC-Setup.exe").Length
          @{ version = $tag; file = $file; size = $size } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          gcloud storage cp latest.json "$bucket/latest.json" `
            --content-type="application/json" --cache-control="no-cache, max-age=0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
